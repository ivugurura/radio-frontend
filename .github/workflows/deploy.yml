name: Frontend Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run lint
        run: yarn lint

  deploy:
    name: Deploy Frontend
    runs-on: ubuntu-latest
    needs: lint
    if: github.ref_type == 'branch'

    steps:
      - name: Deploy over SSH (server-side build)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script_stop: true
          script: |
            set -euo pipefail

            REPO_DIR="${DEPLOY_PATH:-${{ secrets.APP_DIR }}}"
            BRANCH="${DEPLOY_BRANCH:-main}"
            WEB_ROOT="${WEB_ROOT:-${{ secrets.APP_WEB_ROOT }}}"

            if [ ! -d "$REPO_DIR/.git" ]; then
              echo "Missing git repository at $REPO_DIR"
              exit 1
            fi

            cd "$REPO_DIR"
            git fetch origin "$BRANCH"
            git checkout "$BRANCH"
            git pull --ff-only origin "$BRANCH"

            # Ensure Node 24 is active in non-interactive SSH sessions.
            export NVM_DIR="$HOME/.nvm"
            if [ -s "$NVM_DIR/nvm.sh" ]; then
              . "$NVM_DIR/nvm.sh"
              nvm install 24
              nvm use 24
            elif command -v node >/dev/null 2>&1; then
              echo "nvm not found; using system node $(node -v)"
            else
              echo "Node.js is not installed on the server and nvm is unavailable"
              exit 1
            fi

            if command -v corepack >/dev/null 2>&1; then
              corepack enable
              corepack prepare yarn@1.22.22 --activate
            fi

            if ! command -v yarn >/dev/null 2>&1; then
              echo "yarn is not available after Node setup"
              exit 1
            fi

            if [ -f yarn.lock ]; then
              yarn
              yarn build
            elif [ -f package-lock.json ]; then
              npm ci
              npm run build
            else
              echo "No supported lockfile found (yarn.lock or package-lock.json)."
              exit 1
            fi

            if [ ! -f "build/index.html" ]; then
              echo "Build output missing build/index.html"
              exit 1
            fi

            SOURCE_BUILD_DIR="$(cd build && pwd -P)"
            mkdir -p "$WEB_ROOT"
            TARGET_WEB_ROOT="$(cd "$WEB_ROOT" && pwd -P)"

            if [ "$SOURCE_BUILD_DIR" = "$TARGET_WEB_ROOT" ]; then
              echo "WEB_ROOT already points to build output directory; skipping rsync"
            else
              rsync -a --delete build/ "$WEB_ROOT"/
            fi

            if [ ! -f "$WEB_ROOT/index.html" ]; then
              echo "Deploy verification failed: $WEB_ROOT/index.html is missing"
              exit 1
            fi

            # Ensure nginx worker can read frontend assets.
            sudo chmod -R a+rX "$WEB_ROOT"
            sudo nginx -t
            sudo systemctl reload nginx
